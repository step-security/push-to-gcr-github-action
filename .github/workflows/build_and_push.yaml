name: Push to GCR GitHub Action
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  metadata:
    name: Workflow metadata
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        run: |
          echo "## Workflow Run Info" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  # example with Workload Identity Federation
  build-and-push-to-gcr-workload-identity:
    name: Build & push - with workload identity
    needs: metadata
    runs-on: ubuntu-latest
    permissions: # <- this section is needed for workload identity
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud
        id: auth
        uses: step-security/google-github-auth@v3
        with:
          service_account: "testing-action@github-auth-test-459305.iam.gserviceaccount.com"
          workload_identity_provider: "projects/<YOUR_PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>"
      - name: Building and pushing the image
        uses: ./
        with:
          # gcloud_service_key: ${{ secrets.JSON_GCLOUD_SERVICE_ACCOUNT_JSON }} # <- not needed when used with step-security/google-github-auth@v3
          registry: gcr.io
          project_id: github-auth-test-459305
          image_name: hello-world-by-push-to-gcr-0
          image_tag: test-${{ github.sha }}, ${{ github.sha }}
          dockerfile: ./test/Dockerfile.test
          context: ./test
          target: build
  # example with gcloud service account key
  build-and-push-to-gcr-service-account:
    name: Build & push - with service account
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud
        id: auth
        uses: step-security/google-github-auth@v3
        with:
          credentials_json: '${{ secrets.B64_GCLOUD_SERVICE_ACCOUNT_JSON }}'
      - name: Building and pushing the image
        uses: ./
        with:
          # gcloud_service_key: ${{ secrets.JSON_GCLOUD_SERVICE_ACCOUNT_JSON }} # <- not needed when used with step-security/google-github-auth@v3
          registry: gcr.io
          project_id: github-auth-test-459305
          image_name: hello-world-by-push-to-gcr-1
          image_tag: test-${{ github.sha }}, ${{ github.sha }}
          dockerfile: ./test/Dockerfile.test
          context: ./test
          target: build
  # example with gcloud service account key, except using google-github-actions/auth step. the login is handled by this action
  build-and-push-to-gcr-without-gcloud-auth-action:
    name: Build & push - without gcloud auth action
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Building and pushing the image
        uses: ./
        with:
          gcloud_service_key: "${{ secrets.JSON_GCLOUD_SERVICE_ACCOUNT_JSON }}"
          registry: gcr.io
          project_id: github-auth-test-459305
          image_name: hello-world-by-push-to-gcr-2
          image_tag: test-${{ github.sha }}, ${{ github.sha }}
          dockerfile: ./test/Dockerfile.test
          context: ./test
          target: build
  # example with push-only
  push-only-image:
    name: Push only - with workload identity
    needs: metadata
    runs-on: ubuntu-latest
    permissions: # <- this section is needed for workload identity
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v6
      # this step mimics your build step which produce a docker image that will be pushed to gcr
      - name: Prepare the image for push_only
        run: |
          docker build -t gcr.io/github-auth-test-459305/hello-world-by-push-to-gcr-3:${{ github.sha }} --file test/Dockerfile.test test
      - name: Authenticate to Google Cloud
        id: auth
        uses: step-security/google-github-auth@v3
        with:
          service_account: "testing-action@github-auth-test-459305.iam.gserviceaccount.com"
          workload_identity_provider: "projects/<YOUR_PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>"
      - name: Pushing the image
        uses: ./
        with:
          # gcloud_service_key: ${{ secrets.JSON_GCLOUD_SERVICE_ACCOUNT_JSON }} # <- not needed when used with step-security/google-github-auth@v3
          registry: gcr.io
          project_id: github-auth-test-459305
          image_name: hello-world-by-push-to-gcr-3
          image_tag: ${{ github.sha }}
          push_only: true
  # if you are checking this file to use this action in your project,
  # you only need obe of the above steps 👆.
  test-images:
    name: Test images from registry
    needs: 
      - build-and-push-to-gcr-workload-identity
      - build-and-push-to-gcr-service-account
      - build-and-push-to-gcr-without-gcloud-auth-action
      - push-only-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        type: [0, 1, 2, 3]
    steps:
      - name: Authenticate to Google Cloud
        uses: step-security/google-github-auth@v3
        with:
          credentials_json: ${{ secrets.JSON_GCLOUD_SERVICE_ACCOUNT_JSON }}
      - name: Testing the image
        run: |
          cat ${GOOGLE_APPLICATION_CREDENTIALS} | docker login -u _json_key --password-stdin gcr.io
          exit $([ "$(docker run gcr.io/github-auth-test-459305/hello-world-by-push-to-gcr-${{ matrix.type }}:${{ github.sha }})" = "Hello World from Push To GCR github action" ])
  cleanup:
    name: Clean up images
    needs: 
      - build-and-push-to-gcr-workload-identity
      - build-and-push-to-gcr-service-account
      - build-and-push-to-gcr-without-gcloud-auth-action
      - push-only-image
      - test-images
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: step-security/google-github-auth@v3
        with:
          credentials_json: ${{ secrets.JSON_GCLOUD_SERVICE_ACCOUNT_JSON }}
      - name: Delete repositories
        run: |
          gcloud artifacts repositories delete gcr.io --location us --quiet
